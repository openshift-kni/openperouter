# OpenPERouter CR for software-only certsuite testing.
#
# Creates the controller DaemonSet, router DaemonSet, and nodemarker
# Deployment. Empty tolerations opt out of the chart defaults (control-plane
# and master taints) so workloads schedule on worker-only HyperShift EaaS
# guest clusters.
apiVersion: network.openperouter.io/v1alpha1
kind: OpenPERouter
metadata:
  name: openperouter
  # Namespace omitted so `oc apply -n <install-ns>` from konflux-certsuite works.
  # Target namespace comes from certsuite-test-bundle.yaml spec.namespace
  # (openperouter-system).
  #
  # Certsuite matches Deployments by pod-template labels, not object
  # metadata. The operator copies these CR labels onto nodemarker /
  # controller / router templates so they survive reconcile.
  labels:
    redhat-best-practices-for-k8s.com/generic: target
spec:
  logLevel: info
  tolerations: []
