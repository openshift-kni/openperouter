contentOrigin:
  repofiles:
    - ../redhat.repo

context:
  containerfile: ../../Dockerfile.openshift

arches:
  - x86_64

packages:
  # FRR is consumed from Fast Datapath (FDP) instead of a prebuilt FRR base
  # image. This scope is prefetched for Dockerfile.openshift.
  - name: catatonit
  - name: frr
  - name: frr-selinux
  - name: grout
  - name: grout-frr
  - name: iproute
  - name: shadow-utils
